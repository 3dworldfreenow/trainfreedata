# Redis settings for RailMon. On Ubuntu 24.04 append/include in /etc/redis/redis.conf:
#   echo "include /etc/redis/railmon-redis.conf" | sudo tee -a /etc/redis/redis.conf
#   sudo cp deploy/redis/railmon-redis.conf /etc/redis/ && sudo systemctl restart redis-server
#
# Redis is used only for cache, de-duplication locks and rate-limit counters.
# Every RailMon key has a TTL, so volatile-lru eviction is safe. Losing Redis
# data is harmless (MySQL holds all persistent state).

bind 127.0.0.1 ::1
protected-mode yes
port 6379
# Must match the password in REDIS_URL in .env
requirepass CHANGE_REDIS_PASSWORD

maxmemory 256mb
maxmemory-policy volatile-lru

# Pure cache: no persistence needed
save ""
appendonly no

timeout 300
tcp-keepalive 60
# Lua scripting (EVAL) is used for safe lock release; keep it enabled.
