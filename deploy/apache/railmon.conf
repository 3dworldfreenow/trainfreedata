# Apache 2.4 reverse proxy for RailMon (Ubuntu 24.04)
#   sudo a2enmod proxy proxy_http headers ssl rewrite expires
#   sudo cp deploy/apache/railmon.conf /etc/apache2/sites-available/railmon.conf
#   sudo a2ensite railmon && sudo systemctl reload apache2
# Get a certificate with: sudo certbot --apache -d railmon.example.com

<VirtualHost *:80>
    ServerName railmon.example.com
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName railmon.example.com

    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/railmon.example.com/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/railmon.example.com/privkey.pem

    # Static assets served directly by Apache
    Alias /static/ /opt/railmon/app/railmon/web/static/
    <Directory /opt/railmon/app/railmon/web/static/>
        Require all granted
        Options -Indexes
        ExpiresActive On
        ExpiresDefault "access plus 7 days"
    </Directory>

    ProxyPreserveHost On
    ProxyPass        /static/ !
    ProxyPass        / http://127.0.0.1:8000/ timeout=90
    ProxyPassReverse / http://127.0.0.1:8000/
    RequestHeader set X-Forwarded-Proto "https"

    # The internal REST API is for the dashboard and local services. Uncomment to
    # restrict token-authenticated service calls to the LAN only:
    # <Location /api/v1/jobs>
    #     Require ip 127.0.0.1 10.0.0.0/8 192.168.0.0/16
    # </Location>

    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "same-origin"

    ErrorLog  ${APACHE_LOG_DIR}/railmon_error.log
    CustomLog ${APACHE_LOG_DIR}/railmon_access.log combined
</VirtualHost>
</IfModule>
