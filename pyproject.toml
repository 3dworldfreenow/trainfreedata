[project]
name = "railmon"
version = "1.0.0"
description = "Indian Railway Intelligence & Monitoring System (self-hosted, free data sources only)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.3",
    "Flask-SQLAlchemy==3.1.1",
    "SQLAlchemy==2.1.6",
    "PyMySQL==1.2.3",
    "redis==8.1.0",
    "APScheduler==3.11.3",
    "requests==2.34.2",
    "cryptography==50.0.2",
    "python-dotenv==1.2.4",
    "gunicorn==26.2.0",
    "PyYAML==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.2.0", "fakeredis==2.40.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
